{% extends "base.html" %}

{% block title %}Pending Users Page{% endblock %}

{% block content %}

<div class="container my-5">

    <table class="table table-dark table-striped table-hover">
  <thead>
    <tr>
      <th scope="col"></th>
      <th scope="col">Roll Number</th>
      <th scope="col">Name</th>
      <th scope="col">Status</th>
      <th scope="col">Action</th>
    </tr>
  </thead>

  <tbody>
    {% for user in users %}
    <tr>
      <th scope="row">{{forloop.counter}}</th>
      <td>{{user.rollno}}</td>
      <td>{{user.name}}</td>
      <td>{{user.status}}</td>
      <td> <a href="{% url "approve" user.unique_id %}" class='btn btn-success'>Approve</a> </td>
    </tr>
    {% endfor %}
  </tbody>

</table>

</div>

{% endblock  %}
